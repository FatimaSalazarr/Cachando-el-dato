<div class="gacha-stage">
  <svg class="gacha-svg-bg" viewBox="0 0 360 700" preserveAspectRatio="none">
    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#0284c7" />
        <stop offset="50%" stop-color="#0369a1" />
        <stop offset="100%" stop-color="#075985" />
      </linearGradient>
      <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#15803d" />
        <stop offset="100%" stop-color="#166534" />
      </linearGradient>
      <linearGradient id="dirtGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#b45309" />
        <stop offset="100%" stop-color="#78350f" />
      </linearGradient>
    </defs>
    <rect width="360" height="700" fill="url(#skyGrad)" />
    <g class="animated-clouds">
      <ellipse cx="90" cy="120" rx="45" ry="16" fill="#ffffff" opacity="0.15" />
      <ellipse cx="270" cy="180" rx="60" ry="20" fill="#ffffff" opacity="0.1" />
      <ellipse cx="180" cy="80" rx="50" ry="18" fill="#ffffff" opacity="0.12" />
    </g>
    <circle cx="180" cy="130" r="150" fill="#ffffff" opacity="0.1" />
    <path d="M 0 410 Q 180 340 360 410 V 700 H 0 Z" fill="url(#grassGrad)" />
    <ellipse cx="180" cy="425" rx="85" ry="28" fill="url(#dirtGrad)" />
  </svg>

  <div class="baseball-graphic" id="baseball-ball">
    <i class="fa-solid fa-baseball"></i>
  </div>

  <div class="bat-graphic" id="baseball-bat">
    <svg viewBox="0 0 100 200" class="bat-svg">
      <path d="M 41 190 C 41 197 59 197 59 190 C 59 184 55 184 55 178 L 55 135 C 55 80 65 55 65 20 C 65 6 35 6 35 20 C 35 55 45 80 45 135 L 45 178 C 45 184 41 184 41 190 Z" fill="#ffd700" stroke="#ff9100" stroke-width="2"/>
    </svg>
  </div>
</div>

<div class="gacha-ui-top">
  <div class="gacha-header-row">
    <h2>GACHA</h2>
    <div class="points-badge-style">
      <i class="fa-solid fa-coins"></i> <span class="user-pts-display">80</span> PTS
    </div>
  </div>
</div>

<div class="gacha-ui-bottom">
  <button class="btn-primary-gacha" id="btn-launch">LANZA LA PELOTA – 50 PTS</button>
</div>
