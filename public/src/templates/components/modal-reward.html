<div id="reward-modal" class="modal-screen hidden">
  <div class="modal-card reward-card-enhanced">
    <button class="close-modal-btn" id="btn-close-reward"><i class="fa-solid fa-xmark"></i></button>
    <div class="reward-model-viewer">
      <model-viewer
        id="reward-model"
        alt="Modelo 3D del premio obtenido"
        camera-controls
        auto-rotate
        auto-rotate-delay="0"
        rotation-per-second="24deg"
        shadow-intensity="1"
        exposure="1.1"
        loading="eager">
      </model-viewer>
      <p id="reward-model-status" role="status" aria-live="polite">El modelo 3D aparecerá aquí.</p>
    </div>
    <div class="reward-meta-box">
      <span class="rarity-badge-enhanced" id="reward-rarity">RARO</span>
      <h2>¡HOME RUN!</h2>
      <p id="reward-title" class="reward-item-name">Tarjeta Rara</p>
      <p id="reward-desc" class="reward-item-desc">Artículo obtenido con éxito.</p>
    </div>
    <button class="btn-primary btn-gold-enhanced" id="btn-claim-reward">¡OBTENER PREMIO!</button>
  </div>
</div>
