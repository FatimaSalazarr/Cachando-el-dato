<div class="auth-box">
  <div class="logo-badge">
    <img src="img/logo1.png" alt="Logo de Cachando el Dato" style="width: 120%; height: 100%; object-fit: contain;">
  </div>
  <h1 class="title">LOGIN</h1>
  <p class="subtitle">CACHANDO EL DATO</p>

  <form id="login-form" onsubmit="event.preventDefault();">
    <div class="form-group">
      <label for="login-email">USUARIO</label>
      <input type="email" id="login-email" placeholder="correo@ejemplo.com" required>
    </div>

    <div class="form-group">
      <label for="login-password">CONTRASEÑA</label>
      <input type="password" id="login-password" placeholder="••••••••" required>
    </div>

    <button type="submit" class="btn-primary" id="btn-login-submit">ENTRAR</button>
  </form>
  <p id="auth-status" class="auth-status" role="status" aria-live="polite"></p>
  <p class="auth-link" id="login-links">¿Sin cuenta? <span id="go-to-register">Registro</span> · <span id="forgot-password-link">¿Olvidaste tu contraseña?</span></p>

  <form id="forgot-password-form" class="auth-secondary-form" hidden>
    <h2>RECUPERAR CONTRASEÑA</h2>
    <p>Te enviaremos instrucciones al correo asociado a tu cuenta.</p>
    <div class="form-group">
      <label for="forgot-password-email">CORREO</label>
      <input type="email" id="forgot-password-email" placeholder="correo@ejemplo.com" required>
    </div>
    <button type="submit" class="btn-primary" id="btn-forgot-password">ENVIAR ENLACE</button>
    <button type="button" class="auth-back-button" id="back-to-login">VOLVER AL INICIO DE SESIÓN</button>
  </form>

  <form id="reset-password-form" class="auth-secondary-form" hidden>
    <h2>NUEVA CONTRASEÑA</h2>
    <div class="form-group">
      <label for="reset-password">CONTRASEÑA NUEVA</label>
      <input type="password" id="reset-password" minlength="8" maxlength="72" autocomplete="new-password" required>
    </div>
    <div class="form-group">
      <label for="reset-password-confirm">CONFIRMAR CONTRASEÑA</label>
      <input type="password" id="reset-password-confirm" minlength="8" maxlength="72" autocomplete="new-password" required>
    </div>
    <button type="submit" class="btn-primary" id="btn-reset-password">CAMBIAR CONTRASEÑA</button>
    <button type="button" class="auth-back-button" id="back-from-reset">VOLVER AL INICIO DE SESIÓN</button>
  </form>
</div>
