<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cachando el Dato - AR & LMN</title>
  
  <!-- Tipografías e Iconos -->
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Estilos Modulares -->
  <link rel="stylesheet" href="src/css/main.css">
  
  <!-- Librerías Externas -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>

  <div class="mobile-frame">
    <!-- 1. PANTALLAS DE AUTENTICACIÓN (LOGIN Y REGISTRO) -->
    <section id="login-screen" class="screen active"></section>
    <section id="register-screen" class="screen"></section>

    <!-- 2. APLICACIÓN PRINCIPAL (TABS Y NAVEGACIÓN) -->
    <main id="app-content" class="app-content hidden">
      <section id="home-screen" class="tab-screen active"></section>
      <section id="team-detail-screen" class="tab-screen"></section>
      <section id="gacha-screen" class="tab-screen"></section>
      <section id="trivia-screen" class="tab-screen"></section>
      <section id="profile-screen" class="tab-screen"></section>

      <!-- BARRA DE NAVEGACIÓN INFERIOR (COMPONENTE) -->
      <div id="bottom-nav-container"></div>
    </main>

    <!-- 3. EXPERIENCIA REALIDAD AUMENTADA Y CÁMARA (MIND-AR) -->
    <div id="ar-experience-modal" class="camera-modal hidden"></div>

    <!-- 4. MODALES REUTILIZABLES (HISTORIA, SIN PUNTOS, PREMIOS) -->
    <div id="modals-container"></div>
  </div>

  <!-- CONTROLADOR PRINCIPAL (ES MODULES) -->
  <script type="module" src="src/js/app.js"></script>
</body>
</html>
